# cargo-deny configuration (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# Purpose: CI gate for license drift (GPL entering the tree), RustSec
# advisories, yanked crates and registry sources.
# Run: `cargo deny check all` (CI runs it with the docs.rs feature set).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # --- transitive, not fixable from this crate (tracked in the ALICE backlog) ---
    # rumqttc 0.25.1 (latest) pins rustls-webpki 0.102 directly; the fixed
    # 0.103.x line is only reachable once rumqttc bumps. `mqtt` feature only.
    "RUSTSEC-2026-0049",  # rustls-webpki: CRL distribution-point matching
    "RUSTSEC-2026-0098",  # rustls-webpki: URI name constraints
    "RUSTSEC-2026-0099",  # rustls-webpki: wildcard name constraints
    "RUSTSEC-2026-0104",  # rustls-webpki: reachable panic in CRL parsing
    # alice-db 0.2.0-beta.2 depends on rkyv 0.7; fix is rkyv >= 0.8.17 upstream. `db` feature only.
    "RUSTSEC-2026-0235",  # rkyv: archive validation OOB read
    # --- unmaintained warnings (informational, not CVEs) ---
    "RUSTSEC-2025-0141",  # bincode 1.x / 2.x unmaintained (transitive via ALICE siblings)
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained (transitive via rumqttc)
]

# ---------------------------------------------------------------------------
# Licenses (allow-list; anything else is denied)
# alice-edge itself is MIT OR Apache-2.0
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# ALICE siblings that are AGPL-3.0-or-later. They are optional features
# (default OFF) consumed as crates.io deps; the exception is scoped to these
# three crates only, not to the license in general.
[[licenses.exceptions]]
name = "alice-codec"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-db"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-ml"
allow = ["AGPL-3.0-or-later"]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# alice-db pulls alice-zip 0.3 while this crate uses 0.5; warn, do not block
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
