# scripts/api_boundary.py (ALICE-Law G7 / G8): the boundary of the public API,
# enumerated from rustdoc JSON, and the decision for each item.
features = "std,zip,law,codec,db,ml,sdf,depth-camera,asp,sensors,mqtt,dashboard,ffi,edge-pipeline,pyo3"

[boundary]
"abi::ffi::alice_delta_decode" = "local: exact integer inverse of alice_delta_encode on the caller's own buffer: no rounding rule and no value from another producer"
"abi::ffi::alice_delta_encode" = "local: exact integer delta transform of the caller's own buffer"
"abi::ffi::alice_edge_clear_last_error" = "local: error-message plumbing, no Law-bearing value"
"abi::ffi::alice_edge_free_error_string" = "local: error-message plumbing, no Law-bearing value"
"abi::ffi::alice_edge_last_error" = "local: error-message plumbing, no Law-bearing value"
"abi::ffi::alice_edge_semantics_id" = "local: reports this build's identifier"
"abi::ffi::alice_edge_version" = "local: reports a constant of this build"
"abi::ffi::alice_evaluate_cubic" = "handshake: coefficients_with_another_identifier_are_refused"
"abi::ffi::alice_evaluate_linear" = "handshake: coefficients_with_another_identifier_are_refused"
"abi::ffi::alice_evaluate_quadratic" = "handshake: coefficients_with_another_identifier_are_refused"
"abi::ffi::alice_filter_outliers_mad" = "local: fits the caller's raw samples in this build; no coefficients come in"
"abi::ffi::alice_fit_constant" = "local: fits the caller's raw samples in this build and returns a mean; no value from another producer comes in"
"abi::ffi::alice_fit_cubic" = "handshake: coefficients_with_another_identifier_are_refused"
"abi::ffi::alice_fit_linear" = "handshake: coefficients_with_another_identifier_are_refused"
"abi::ffi::alice_fit_linear_robust" = "local: fits the caller's raw samples; its AliceLinearResult carries this build's semantics_id"
"abi::ffi::alice_fit_linear_simd" = "local: fits the caller's raw samples; its AliceLinearResult carries this build's semantics_id"
"abi::ffi::alice_fit_quadratic" = "handshake: coefficients_with_another_identifier_are_refused"
"abi::ffi::alice_int_to_q16" = "local: exact integer scaling of a host value"
"abi::ffi::alice_q16_to_f32" = "local: a local conversion of a host value, computed by this build"
"abi::ffi::alice_q16_to_int" = "local: exact integer scaling of a host value"
"abi::ffi::alice_residual_error" = "handshake: coefficients_with_another_identifier_are_refused"
"abi::ffi::alice_should_use_linear" = "local: model selection over the caller's raw samples in this build"
"abi::ffi::alice_zeroize" = "local: overwrites the caller's buffer with zeros"
"abi::python::alice_edge::__pyo3_init" = "local: module initialisation generated by pyo3; the Python entry points are decided in scripts/boundaries.toml"
"fn::<DepthCameraDriver for DolphinD5Driver>::info" = "local: a device description string, not a Law-bearing value"
"fn::<SensorDriver for Adxl345Sensor>::name" = "local: a static sensor name, not a Law-bearing value"
"fn::<SensorDriver for Bme280Sensor>::name" = "local: a static sensor name, not a Law-bearing value"
"fn::<SensorDriver for Bno055Sensor>::name" = "local: a static sensor name, not a Law-bearing value"
"fn::<SensorDriver for Dht22Sensor>::name" = "local: a static sensor name, not a Law-bearing value"
"fn::<SensorDriver for GpsSensor>::name" = "local: a static sensor name, not a Law-bearing value"
"fn::<SensorDriver for Max30102Sensor>::name" = "local: a static sensor name, not a Law-bearing value"
"fn::<SensorDriver for SimulatedSensor>::name" = "local: a static sensor name, not a Law-bearing value"
"fn::Bme280Sensor::new" = "local: an I2C address typed u8, not bytes"
"fn::CoefficientPayload::from_binary" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::CoefficientPayload::from_json" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::CoefficientPayload::to_binary" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::CoefficientPayload::to_json" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::CoefficientStore::open" = "handshake: a_slope_read_of_foreign_arithmetic_is_an_error_not_an_empty_result"
"fn::CoefficientStore::open_with_options" = "handshake: a_slope_read_of_foreign_arithmetic_is_an_error_not_an_empty_result"
"fn::CoefficientStore::open_with_policy" = "handshake: a_slope_read_of_foreign_arithmetic_is_an_error_not_an_empty_result"
"fn::ConnectRefused::code" = "local: the MQTT 3.1.1 CONNACK return code (1 to 5) of a refusal, typed u8; a protocol status, not bytes and not a Law-bearing value"
"fn::DashboardSnapshot::to_binary" = "local: operational metrics (uptime, rates, counters) for monitoring; nothing in this crate reads them back"
"fn::DashboardSnapshot::to_json" = "local: operational metrics for monitoring; nothing in this crate reads them back"
"fn::Dht22Sensor::new" = "local: a GPIO pin number typed u8, not bytes"
"fn::EdgeDashboard::record_compression" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::EdgeDashboard::record_sensor" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::EdgeDashboard::sensor_frequency" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::EdgeDashboard::to_json" = "local: operational metrics for monitoring; nothing in this crate reads them back"
"fn::EdgeStreamEncoder::encode_frame" = "local: returns AspEdgePacket in memory, a concrete Rust type; libasp's wire format is libasp's boundary"
"fn::FirmwareInfo::is_newer_than" = "local: compares firmware version labels"
"fn::GpsSensor::new" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::MqttConfig::aws_iot" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::MqttConfig::azure_iot" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::MqttConfig::local" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::MqttPublisher::publish_binary" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::MqttPublisher::publish_coefficients" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::MqttTlsConfig::from_pem_files" = "local: reads TLS certificate files, key material and not a Law-bearing value"
"fn::ObjectClass::from_id" = "local: a class index typed u8, not bytes"
"fn::ObjectClass::label" = "local: returns the class's static label"
"fn::OtaManager::current_version" = "local: returns the firmware version label"
"fn::OtaManager::progress" = "local: a download percentage typed u8, not bytes"
"fn::OtaManager::receive_firmware" = "local: firmware image bytes kept for the (simulated) update; never decoded into a Law-bearing value"
"fn::OtaModelStore::get_model" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::OtaModelUpdate::from_binary" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::OtaModelUpdate::from_json" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::OtaModelUpdate::to_binary_ext" = "handshake: payloads_with_another_identifier_are_refused_naming_both"
"fn::SdfFeatures::from_primitive" = "local: a primitive kind typed u8, not bytes"
"fn::TelemetryHub::device_health" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::TelemetryHub::device_metrics" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::TelemetryHub::timed_out_devices" = "local: a text label or name chosen by the caller (sensor, channel, host, client id, path), not parsed into a Law-bearing value"
"fn::TernaryClassifier::from_weights" = "local: ternary weights typed i8 given in memory by the caller, a concrete Rust value"
"fn::TernaryClassifier::load_weights" = "handshake: weights_with_another_identifier_are_refused_naming_both"
"fn::TernaryClassifier::load_weights_unverified_legacy" = "handshake: legacy_weights_need_the_unverified_loader"
"fn::TernaryClassifier::save_weights" = "handshake: weights_with_another_identifier_are_refused_naming_both"
"fn::info" = "local: DepthCameraDriver::info declaration: a device description string"
"fn::name" = "local: SensorDriver::name declaration: a static sensor name"
"fn::sdf_compress::svo_diff_hash" = "local: FNV hash over SVO bytes this crate produced, an identity hash and not a decoder"
"fn::semantics::check_semantics" = "local: the identifier comparison itself, used by every handshake listed here"
"impl::Deserialize for DashboardSnapshot" = "local: operational metrics for monitoring (sensors feature), no Law-bearing value"
"impl::Deserialize for LatencyStats" = "local: latency counters for monitoring (sensors feature), no Law-bearing value"
"impl::Serialize for DashboardSnapshot" = "local: operational metrics for monitoring (sensors feature), no Law-bearing value"
"impl::Serialize for LatencyStats" = "local: latency counters for monitoring (sensors feature), no Law-bearing value"
"reexport::alice_core::law::IngestPolicy" = "local: alice-zip's SignalLaw types re-exported for the law module; values of these types are passed in memory as concrete types"
"reexport::alice_core::law::LawError" = "local: alice-zip's SignalLaw types re-exported for the law module; values of these types are passed in memory as concrete types"
