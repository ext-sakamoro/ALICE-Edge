[G6]
status = "fail-known"
note = "src/lib.rs:151 re-exports alice_det_math::SEMANTICS_ID; the crate folds no pins of its own into an identifier. tests/determinism_golden.rs:888 (golden_semantics_id) pins the re-exported value to its hex and asserts it equals alice_det_math::SEMANTICS_ID, so an arithmetic change in the dependency is seen, but a change to this crate's own rounding rules (the Q16.16 normal equations, the MAD rejection constants) moves no identifier. What the crate's own pin would be is not decided."
reference_repo = "ALICE-Zip"

[G7]
status = "unverified"
note = "The boundaries that erase the Rust type were listed but not ruled on: src/ffi.rs (extern \"C\" functions taking Q16.16 coefficients and sample arrays), src/python.rs (PyO3 exports such as evaluate_linear_batch at line 114), src/mqtt_bridge.rs (OtaModelUpdate::from_json at 388 and from_binary at 433 read coefficients sent by another device), src/zip_bridge.rs:50 (decompress_coefficients) and src/db_bridge.rs. Only the last compares an identifier: it returns alice-db's ResidualError::Mismatch (CoefficientStoreError::residual, src/db_bridge.rs:73) and tests/db_bridge_errors.rs a_slope_read_of_foreign_arithmetic_is_an_error_not_an_empty_result feeds a store written under another identifier. The others carry integer Q16.16 coefficients; whether those count as Law-bearing values (they do not depend on SEMANTICS_ID, which covers float transcendentals) needs a decision by the crate owner before the cell can be pass or fail-known."

[G8]
status = "unverified"
note = "Writers found: src/mqtt_bridge.rs CoefficientPayload::to_json (192) and to_binary (211, fixed 24 bytes), OtaModelUpdate::to_binary_ext (481), src/zip_bridge.rs CompressedModelBatch (15, alice-zip's format), src/db_bridge.rs (alice-db's format, which carries its own identifier). The three mqtt layouts have no identifier field, and to_json also writes float fields (slope_f32, residual_error). Same open question as G7: whether the payload values are Law-bearing; no decision was made, so the cell is not set to fail-known."

[G9]
status = "unverified"
note = "The identifier this crate exposes is alice-det-math's (G6), and the crate defines no identifier of its own whose history could be audited; the history audit of that identifier belongs to alice-det-math. Depends on the G6 and G8 decisions."

[G10]
status = "fail-known"
note = "No lint on clocks or random sources in clippy.toml and no scan. 25 Instant::now() reads in library code (all outside cfg(test)): src/sensors.rs 399, 508, 538, 545, 681, 827, 847, 965, 1120, 1227 (timestamps of simulated sensor samples and driver timing); src/edge_pipeline.rs 141, 144, 159, 165, 170, 212, 216 (stage timing); src/dashboard.rs 63, 64, 265 (uptime and reset); src/watchdog.rs 26, 37, 52 (heartbeat); src/depth_capture.rs 235, 240 (capture time). The fits read only sample values, so a fit coefficient does not depend on these reads; the timestamps that sensors.rs and depth_capture.rs write into the sample batches do. No SystemTime, Uuid or unseeded random source is used (grep over src/). Which of these paths are Law-bearing outputs is not decided."
reference_repo = "ALICE-DB"

