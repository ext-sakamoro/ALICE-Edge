[package]
name = "alice-edge"
version = "0.1.1"
edition = "2021"
# MSRV: `u64::is_multiple_of` (1.87) and the crates.io siblings alice-zip /
# alice-codec / alice-db all declare 1.87. CI `msrv` job compiles on exactly
# this toolchain; bump the job's `@1.87` together with this field.
rust-version = "1.87"
# MSRV-aware dependency resolution (cargo 1.84+): `cargo update` never picks a
# dep whose rust-version exceeds the one declared above.
resolver = "3"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Embedded Model Generator - Don't send data, send the law"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-Edge"
keywords = ["embedded", "no_std", "compression", "edge", "iot"]
categories = ["embedded", "no-std", "compression"]
readme = "README.md"

[lib]
name = "alice_edge"
crate-type = ["rlib"]

# The feature set docs.rs builds with. CI clippy / doc / msrv use the same
# list (pyo3 needs a Python runtime, sensors-hw needs Linux GPIO crates).
[package.metadata.docs.rs]
features = ["std", "zip", "codec", "db", "ml", "sdf", "depth-camera", "asp", "sensors", "mqtt", "dashboard", "ffi"]

[features]
default = []
# Enable std for testing on host
std = []
pyo3 = ["dep:pyo3", "dep:numpy", "std"]  # Python bindings
zip = ["dep:alice_core", "std"]  # Compress model coefficients with ALICE-Zip
codec = ["dep:alice-codec", "std"]  # Wavelet denoising for sensor data
db = ["dep:alice-db", "std"]  # ALICE-DB persistence for model coefficients
depth-camera = ["dep:rusb", "std"]  # Dolphin D5 Lite depth camera driver
sdf = ["dep:alice-sdf", "std"]  # SDF compression for point clouds
ml = ["dep:alice-ml", "std"]  # 1.58bit ternary object classification
asp = ["dep:libasp", "std", "sdf", "ml"]  # ALICE Streaming Protocol bridge (libasp 1.0 on crates.io; asp_bridge uses sdf_compress + object_classifier::ObjectClass)
edge-pipeline = ["depth-camera", "sdf", "ml", "asp"]  # Full edge pipeline
sensors = ["dep:serde", "std"]  # Sensor drivers (simulated)
sensors-hw = ["sensors", "dep:rppal", "dep:serialport"]  # Real GPIO/I2C/SPI/UART
mqtt = ["dep:rumqttc", "std"]  # MQTT publish to AWS IoT / Azure / local
dashboard = ["dep:alice-analytics", "std"]  # ALICE-Analytics dashboard
ffi = []  # C-ABI FFI exports (extern "C" functions)、panic 隔離は std 時のみ (bare-metal は unwinding なし)

[dependencies]
# No dependencies - pure no_std (except optional Python bindings)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }
alice_core = { package = "alice-zip", version = "0.5", optional = true, default-features = false, features = ["std", "lzma"] }
alice-codec = { version = "0.1", optional = true, default-features = false, features = ["std"] }
# crates.io (0.2.0-beta.2 = ALICE-DB main); the CI sibling stub carried version 0.1.0
# and could never satisfy `^0.2.0-beta.1`, so every job that resolved deps was red
alice-db = { version = "0.2.0-beta.2", optional = true, default-features = false }
rusb = { version = "0.9", optional = true }
alice-sdf = { version = "1.9", optional = true, default-features = false, features = ["svo"] }
alice-ml = { version = "0.2", optional = true, default-features = false, features = ["std"] }
libasp = { version = "1.0", optional = true, default-features = false }
# Sensor drivers
rppal = { version = "0.19", optional = true }
serialport = { version = "4.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# MQTT bridge
rumqttc = { version = "0.25", optional = true }
# Dashboard
alice-analytics = { version = "0.1", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic = "abort" は撤去 (2026-09-17): FFI の catch_unwind (src/ffi.rs guard) は
# unwind でしか機能せず、abort だと host process ごと落ちる
strip = true

[dev-dependencies]
# For testing on host
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "pi5_bench"
harness = false

[[example]]
name = "bme280_compress"
required-features = ["sensors", "std"]

[[example]]
name = "simulate_sensors"
required-features = ["sensors", "std"]

[[example]]
name = "multi_sensor_hub"
required-features = ["sensors", "std"]

[[example]]
name = "dashboard_demo"
required-features = ["sensors", "dashboard", "std"]

[[example]]
name = "mqtt_aws_iot"
required-features = ["sensors", "mqtt", "std"]

[[example]]
name = "mqtt_local"
required-features = ["sensors", "mqtt", "std"]

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
