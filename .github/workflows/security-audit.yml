name: Security & Hygiene

# Purpose:
# - weekly RustSec advisory (CVE) detection
# - block license drift in the dependency tree (GPL entering etc.)
# - unused dependency detection
# - CI gate for placeholder implementations (todo! / unimplemented! / panic!(STUB) / dbg!)
# - API compatibility against the crates.io release (semver-checks)
#
# ci.yml stays focused on build / test / clippy / doc; this workflow is the
# security + hygiene lane, triggered on push + PR + weekly cron.
# scripts/preflight.sh runs the same commands with the same arguments.

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - 'scripts/stub_guard.sh'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - 'scripts/stub_guard.sh'
  schedule:
    # Monday 09:00 UTC = 18:00 JST; catches advisories published between commits
    - cron: '0 9 * * 1'
  workflow_dispatch:

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run on the same branch cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"
  # docs.rs feature set (Cargo.toml [package.metadata.docs.rs]); pyo3 needs a
  # Python runtime and sensors-hw needs Linux GPIO crates, both excluded.
  FULL_FEATURES: "std,zip,law,codec,db,ml,sdf,depth-camera,asp,sensors,mqtt,dashboard,ffi"

jobs:
  audit:
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # Cargo.lock is not committed (library crate); generate it with the full
      # feature set so every optional dependency is scanned.
      - name: Generate lockfile
        run: cargo generate-lockfile

      # The ignore list mirrors deny.toml [advisories].ignore with the reason
      # for each entry; keep the two in sync. The database is kept under
      # target/ so it never collides with the cargo-deny database in
      # ~/.cargo/advisory-db.
      #
      # RUSTSEC-2026-0235 (rkyv 0.7 Rc/Arc archive validation): rkyv is reached
      # only through alice-db (`db` feature), whose archived types
      # (SegmentMetadata / DataSegment / ModelType / DataType) hold no Rc / Arc,
      # so the advisory does not apply. This crate neither depends on rkyv nor
      # archives anything; scripts/no_direct_rkyv.py (ci.yml docs-lint and
      # preflight) fails as soon as either changes. The root fix is alice-db
      # moving off rkyv 0.7 (pending); the entry goes when that release is
      # consumed.
      - name: Run cargo audit
        run: |
          cargo audit \
            --db "$RUNNER_TEMP/advisory-db" \
            --deny yanked \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2025-0134

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --features "$FULL_FEATURES" check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # Static Cargo.toml analysis; false positives go into
      # [package.metadata.cargo-machete] ignored = [...] (none today).
      - uses: bnjbvr/cargo-machete@main

  package-integrity:
    name: Package integrity (publish される .crate が build できるか)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # the lock-free check below builds the pyo3 bindings, which need a Python
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      - name: cargo package (.crate を作る)
        # --no-verify: 未 publish の sibling に path dep がある repo では verify step が
        #   registry 解決で落ちる 展開後の隔離 build が本体なので verify は不要
        run: cargo package --no-verify --allow-dirty

      - name: 展開して隔離 build
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' | head -1)
          [ -n "$crate" ] || { echo "::error::.crate が生成されていない"; exit 1; }
          echo "packaged: $(basename "$crate") ($(du -h "$crate" | cut -f1))"
          tmp=$(mktemp -d)
          tar xzf "$crate" -C "$tmp"
          cd "$tmp"/*/
          # 親 workspace を継承すると member 扱いになり、境界を越えた file が
          # 再び見えてしまう (検査の意味が消える) ので単独 package として build
          printf '\n[workspace]\n' >> Cargo.toml
          # sensors-hw が libudev-sys を引き、runner に system library libudev が無いと
          # build script が panic する packaging 検査としては default features で成立する
          cargo check --locked
          # cargo package の verify も上の check も test target を build しない
          # tests/ が include! する file や実行時に開く fixture が欠けると、
          # 展開した crate の test だけが壊れるので、展開先で test を実行する
          # (docs.rs の feature 集合、sensors-hw は上と同じ理由で外す)
          cargo test --locked --tests --features "$FULL_FEATURES"
          # a consumer resolves dependencies afresh, not from this repository's lock:
          # drop the shipped lock and check that the newest compatible versions still
          # build, every feature except sensors-hw (libudev, as above)
          rm -f Cargo.lock
          cargo check --lib --features "$FULL_FEATURES,edge-pipeline,pyo3"
          grep -q '^name = "alice-det-math"$' Cargo.lock || { echo "::error::lock 無しの check で alice-det-math が解決されていない"; exit 1; }

  coverage:
    name: Coverage (cargo-llvm-cov, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Informational: the number is watched, no threshold is enforced. The
      # build itself must succeed (no continue-on-error, so a compile error is
      # still red); `|| true` only softens the summary print.
      - name: Run coverage
        run: |
          set -o pipefail
          cargo llvm-cov --lib --summary-only --features "$FULL_FEATURES" 2>&1 | tee coverage-summary.txt

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  semver-checks:
    name: cargo-semver-checks (API compat vs crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Pinned: `@latest` tracks rustc MSRV faster than rust-toolchain.toml.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      # Compares HEAD against the latest crates.io release (0.1.0). A breaking
      # change must ship with a version bump, which makes this job green again.
      #
      # `law` is excluded because the baseline release has no such feature.
      # `dashboard` is excluded until the next publish: 0.1.0 imports
      # `alice_analytics::{CountMinSketch, HyperLogLog}` from the crate root,
      # which alice-analytics 0.1.0 does not export, so the baseline cannot be
      # documented with that feature (fixed on main, see CHANGELOG).
      - name: Run cargo semver-checks
        run: |
          feats=$(echo "$FULL_FEATURES" | tr ',' '\n' | grep -vx -e dashboard -e law | paste -sd, -)
          echo "features: $feats"
          cargo semver-checks check-release --package alice-edge \
            --only-explicit-features --features "$feats"

  stub-guard:
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Production path (src/) must not carry todo! / unimplemented! /
      # panic!("...STUB...") placeholders or dbg!; 0 files compared is red.
      - name: Detect todo! / unimplemented! / panic!(STUB) / dbg! in src/**
        run: scripts/stub_guard.sh

      # TODO / FIXME / XXX / HACK are informational (visible to the reviewer,
      # not blocking).
      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "OK: no TODO/FIXME/XXX/HACK in src/"
          fi
