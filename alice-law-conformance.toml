[G12]
status = "pass"
evidence = [".github/workflows/public-text.yml", "scripts/public_text.sh", ".github/public-text-pin", "scripts/test_public_text.py", ".public-text.toml"]
mutant = "commit a document line that names an internal rules file to README.md on a scratch branch and run PUBLIC_TEXT_BASE=origin/main scripts/public_text.sh: it reports 'README.md:276: private name' and exits 1; on the unchanged tree it exits 0 ('0 findings in 99 files at HEAD'). Carried out on the commit that introduced this file."
since = "e11dfa4"
note = "the workflow fetches ALICE-Law's scripts/public_text_check.py at the revision in .github/public-text-pin (ca96d9214ffe0da43e9cb034417a4f6c041ba4be) and refuses it unless its sha256 is 3aef3cdd095b374153dbb74f228828d559cb88f78b33f36570c96cbcb80eb6d5 (that is the hash of the file at that revision, checked with git show); it reads the tree at HEAD and the commits since the base, exits 2 when it compared nothing, and runs on pushes to main and ci/** branches and on pull requests. .public-text.toml allows the words the docs linter and its test must contain, by exact line count per file."
reference_repo = "ALICE-Law"

[G13]
status = "fail-known"
note = "src/edge_pipeline.rs:350-371 (voxel_grid_downsample, feature edge-pipeline) collects `voxel_map.values()` of a std HashMap into the returned point list, so the order of the output points depends on the map's random state; measured: two calls on the same 200 points in one process return the same set in different orders (same_order=false). The per-voxel sums are added in input order, so the values are stable, only the order varies. src/telemetry.rs:284-292 (timed_out_devices) also returns the keys of a HashMap in iteration order. Membership-only uses, no output order: src/depth_capture.rs:151 (voxel_downsample keeps the first point per cell, the map only answers 'seen'), src/mqtt_bridge.rs:500-541 (OtaModelStore: get / insert / len). No parallel reduction in the crate (no rayon; src/mqtt_bridge.rs:273 spawns one thread for the network loop)."
reference_repo = "ALICE-LOL"

