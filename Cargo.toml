[package]
name = "alice-edge"
version = "0.4.0"
edition = "2021"
# MSRV: `u64::is_multiple_of` (1.87) and the crates.io siblings alice-zip /
# alice-codec / alice-db all declare 1.87. CI `msrv` job compiles on exactly
# this toolchain; bump the job's `@1.87` together with this field.
rust-version = "1.87"
# MSRV-aware dependency resolution (cargo 1.84+): `cargo update` never picks a
# dep whose rust-version exceeds the one declared above.
resolver = "3"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Embedded Model Generator - Don't send data, send the law"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Edge"
keywords = ["embedded", "no_std", "compression", "edge", "iot"]
categories = ["embedded", "no-std", "compression"]
readme = "README.md"
# What the published .crate contains, as an allowlist: a new top-level file or
# directory stays out until it is named here. CI tooling, helper scripts, fuzz
# targets and editor / toolchain settings are not part of the library.
# scripts/package_contents_check.py checks the packaged list against this
# (forbidden paths, every Cargo target, every file a packaged source embeds)
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/fixtures/**",
    "/benches/**/*.rs",
    "/examples/**/*.rs",
    "/bindings/alice_edge.h",
    "/bindings/AliceEdge.cs",
    "/README.md",
    "/README_JP.md",
    "/CHANGELOG.md",
    "/LICENSE-Proprietary",
    "/TRADEMARK_NOTICE",
]

[lib]
name = "alice_edge"
crate-type = ["rlib"]

# The feature set docs.rs builds with. CI clippy / doc / msrv use the same
# list (pyo3 needs a Python runtime, sensors-hw needs Linux GPIO crates).
[package.metadata.docs.rs]
features = ["std", "zip", "law", "codec", "db", "ml", "sdf", "depth-camera", "asp", "sensors", "mqtt", "dashboard", "ffi"]

[features]
default = []
# Enable std for testing on host
std = ["alice-det-math/std"]
pyo3 = ["dep:pyo3", "dep:numpy", "std"]  # Python bindings
zip = ["alice_core/std", "alice_core/lzma", "std"]  # Compress model coefficients with ALICE-Zip
# Edge fits as alice_zip::law::SignalLaw (evidence, measured residual, valid
# range, provenance). no_std + alloc: alice-zip is used without its std feature
law = []
codec = ["dep:alice-codec", "std"]  # Wavelet denoising for sensor data
db = ["dep:alice-db", "std"]  # ALICE-DB persistence for model coefficients
depth-camera = ["dep:rusb", "std"]  # Dolphin D5 Lite depth camera driver
sdf = ["dep:alice-sdf", "std"]  # SDF compression for point clouds
ml = ["dep:alice-ml", "std"]  # 1.58bit ternary object classification
asp = ["dep:libasp", "std", "sdf", "ml"]  # ALICE Streaming Protocol bridge (libasp 1.0 on crates.io; asp_bridge uses sdf_compress + object_classifier::ObjectClass)
edge-pipeline = ["depth-camera", "sdf", "ml", "asp"]  # Full edge pipeline
sensors = ["dep:serde", "std"]  # Sensor drivers (simulated)
# Serialize / Deserialize on mqtt_bridge::CoefficientPayload with no semantics
# identifier in the bytes: not a durable or exchange format. Payloads carry the
# identifier through CoefficientPayload::to_json / to_binary
serde-raw = ["dep:serde"]
sensors-hw = ["sensors", "dep:rppal", "dep:serialport"]  # Real GPIO/I2C/SPI/UART
mqtt = ["dep:rustls", "std"]  # MQTT 3.1.1 publish (QoS 1, TCP or mutual TLS) to AWS IoT / Azure / local
dashboard = ["dep:alice-analytics", "std"]  # ALICE-Analytics dashboard
ffi = []  # C-ABI FFI exports (extern "C" functions)、panic 隔離は std 時のみ (bare-metal は unwinding なし)

[dependencies]
# The only mandatory dependency, and itself dependency-free `no_std`: the
# platform `libm` differs in the last ulp between macOS, glibc, MSVC and wasm,
# so every float transcendental goes through this crate, whose kernels are
# built from IEEE 754 basic operations in a fixed evaluation order. A fit
# computed on one device and a fit computed on another must be the same bits,
# because the coefficients are what gets transmitted and stored. Enforced by
# `clippy.toml` `disallowed-methods`, pinned by tests/determinism_golden.rs.
alice-det-math = { version = "0.5.1", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }
# `zip` turns on alice-zip's std + lzma, `law` uses it without them (no_std)
alice_core = { package = "alice-zip", path = "../ALICE-Zip", version = ">=0.11, <0.12", default-features = false }
alice-codec = { version = "0.1", optional = true, default-features = false, features = ["std"] }
# alice-db (from 0.4) keeps its file backend behind the default `fs` feature; this
# crate opens on-disk stores, so `fs` is named explicitly
alice-db = { path = "../ALICE-DB", version = ">=0.6, <0.7", optional = true, default-features = false, features = ["fs"] }
rusb = { version = "0.9", optional = true }
alice-sdf = { path = "../ALICE-SDF", version = ">=7, <8", optional = true, default-features = false, features = ["svo"] }
alice-ml = { version = "0.2", optional = true, default-features = false, features = ["std"] }
libasp = { version = "1.0", optional = true, default-features = false }
# Sensor drivers
rppal = { version = "0.19", optional = true }
serialport = { version = "4.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# MQTT bridge: TLS for the built-in MQTT 3.1.1 client, `ring` provider (no
# cmake / NASM build), PEM parsing through the re-exported rustls-pki-types
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
# Dashboard
alice-analytics = { path = "../ALICE-Analytics", version = ">=0.7, <0.8", optional = true }

# The two float lints that propose re-fusing arithmetic are off as a property
# of the crate, not case by case: every transcendental goes through
# `alice-det-math` (see clippy.toml), and these lints propose rewriting those
# calls back into `mul_add` or platform `libm` forms. `alice-det-math` itself
# declares them the same way. They live in clippy's `nursery` group, which the
# gates do not enable today, so this is a guard for the day one does.
[lints.clippy]
suboptimal_flops = "allow"
imprecise_flops = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic = "abort" は撤去 (2026-09-17): FFI の catch_unwind (src/ffi.rs guard) は
# unwind でしか機能せず、abort だと host process ごと落ちる
strip = true

[dev-dependencies]
# For testing on host
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
# cross-platform golden hashes (tests/determinism_golden.rs); `oid` names
# SHA-256 in the test certificates below
sha2 = { version = "0.10", features = ["oid"] }
# certificates for the mutual-TLS tests of the MQTT client (tests/mqtt_tls.rs),
# made at test time in pure Rust (no C build, so `--all-targets` cross checks
# need no C cross compiler); keys are derived from fixed labels
x509-cert = { version = "0.2.5", default-features = false, features = ["builder", "pem", "std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }

[[bench]]
name = "edge_bench"
harness = false

[[example]]
name = "edge_law"
required-features = ["law"]

[[example]]
name = "bme280_compress"
required-features = ["sensors", "std"]

[[example]]
name = "simulate_sensors"
required-features = ["sensors", "std"]

[[example]]
name = "multi_sensor_hub"
required-features = ["sensors", "std"]

[[example]]
name = "dashboard_demo"
required-features = ["sensors", "dashboard", "std"]

[[example]]
name = "mqtt_aws_iot"
required-features = ["sensors", "mqtt", "std"]

[[example]]
name = "mqtt_local"
required-features = ["sensors", "mqtt", "std"]

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
