# Determinism gate: the platform `libm` is not bit-exact across OS / CPU /
# compiler, so every float transcendental must go through `alice-det-math`,
# whose kernels are built from IEEE 754 basic operations only. An Edge fit is
# transmitted and stored as coefficients, so a device that rounds one ulp
# differently produces a different model from the same samples.
#
# CI and scripts/preflight.sh run clippy with `--all-targets ... -D warnings`,
# which turns `disallowed_methods` into a red gate for the library, the tests,
# the examples and the benches alike.
#
# `powi` is listed because it lowers to a multiplication tree whose
# association order is unspecified; write the multiplications out, or use
# `alice_det_math::powi` for `f32`.
#
# Deliberately absent: `sqrt` and `mul_add`. IEEE 754 requires both to be
# correctly rounded (`mul_add` is a fused multiply-add with a single rounding,
# and a target without an FMA instruction gets the correctly rounded software
# `fma`), so both are bit-identical on every target Rust supports.
#
# Pinned by tests/determinism_golden.rs (SHA-256 of bit patterns, run on the
# four-OS CI matrix).
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::cos", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::tan", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
