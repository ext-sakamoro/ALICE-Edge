# cargo-deny configuration (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# Purpose: CI gate for license drift (GPL entering the tree), RustSec
# advisories, yanked crates and registry sources.
# Run: `cargo deny check all` (CI runs it with the docs.rs feature set).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # --- transitive, not fixable from this crate ---
    # rkyv 0.7 Rc/Arc archive validation: rkyv is reached only through alice-db
    # (`db` feature), whose archived types (SegmentMetadata / DataSegment /
    # ModelType / DataType) hold no Rc / Arc, so the advisory does not apply.
    # This crate neither depends on rkyv nor archives anything
    # (scripts/no_direct_rkyv.py fails if either changes). Root fix: alice-db
    # moving off rkyv 0.7 (pending); drop the entry when that release is consumed.
    "RUSTSEC-2026-0235",  # rkyv: Rc/Arc archive validation
    # --- unmaintained warnings (informational, not CVEs) ---
    "RUSTSEC-2025-0141",  # bincode 1.x / 2.x unmaintained (transitive via ALICE siblings)
]

# ---------------------------------------------------------------------------
# Licenses (allow-list; anything else is denied)
# alice-edge itself is LicenseRef-Proprietary (publish = false, see
# [licenses.private] below)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# this crate is publish = false and LicenseRef-Proprietary: unpublished
# workspace crates are not checked against the allow list
[licenses.private]
ignore = true

# ALICE siblings taken from crates.io as optional features (default OFF); the
# exception is scoped to these three crates only, not to the license in general.
[[licenses.exceptions]]
name = "alice-codec"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-db"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-ml"
allow = ["AGPL-3.0-or-later"]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# duplicates come from third-party crates (bincode / bitflags / getrandom); warn, do not block
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
