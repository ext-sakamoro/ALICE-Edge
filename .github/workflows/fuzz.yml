name: Fuzz

# Purpose:
# - time-boxed fuzzing of the no_std fitting core (linear / SIMD parity,
#   polynomial fits, piecewise segmentation, delta coding roundtrip)
# - every push / PR gets 60 s per target; the daily cron is the long lane
#
# Notes:
# - cargo-fuzz needs nightly (rust-toolchain.toml pins stable, overridden here)
# - fuzz/ is its own crate, not a workspace member
# - every step is blocking: a crash, a leak, an out-of-memory, a per-input
#   timeout or a run that executed 0 inputs is a red job
# - cargo-fuzz is installed with `cargo install`: the prebuilt binaries target
#   musl, which the sanitizer build refuses

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/fuzz.txt)
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'fuzz/**'
      - 'tests/support/**'
      - 'rust-toolchain.toml'
      - 'scripts/changed_paths.py'
      - '.github/workflows/fuzz.yml'
      - '.github/paths/fuzz.txt'
  schedule:
    # 03:00 UTC daily = 12:00 JST
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# read-only token: the jobs only check out the repository and upload
# artifacts, which needs no extra scope
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/fuzz.txt

  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    # build + a 60 s run normally take under 10 min
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # the runners are shared with every other workflow: a branch run takes
      # at most 2 at a time, main all 4
      max-parallel: ${{ github.ref == 'refs/heads/main' && 4 || 2 }}
      matrix:
        target:
          - fuzz_fit_linear
          - fuzz_polyfit
          - fuzz_piecewise
          - fuzz_delta_roundtrip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # a compile error in a fuzz target is a red job
      - name: Build fuzz target
        run: |
          cd fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # Inputs that crashed earlier are committed under
      # fuzz/regressions/<target>/ and replayed one by one before the
      # exploration run, so a fixed crash stays fixed
      - name: Replay regression inputs
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          cd fuzz
          T="${{ matrix.target }}"
          dir="regressions/$T"
          shopt -s nullglob
          files=("$dir"/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no regression inputs for $T"
            exit 0
          fi
          echo "replaying ${#files[@]} regression inputs for $T"
          cargo +nightly fuzz run "$T" "${files[@]}"

      # A crash, a leak, an out-of-memory (-rss_limit_mb) or a slow input
      # (-timeout, seconds per input) makes libFuzzer exit non-zero, and the
      # job fails with it. A run that executed 0 inputs is not a pass either.
      # The summary row is written before the step fails, so a crash still
      # shows up there
      - name: Run fuzz target (time-boxed)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          cd fuzz
          T="${{ matrix.target }}"
          extra=()
          if [ -d "regressions/$T" ]; then extra=("regressions/$T"); fi
          mkdir -p "corpus/$T"
          set +e
          cargo +nightly fuzz run "$T" "corpus/$T" "${extra[@]}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }} \
            -timeout=30 -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz-run.log
          rc=${PIPESTATUS[0]}
          set -e
          runs=$(grep -oE "Done [0-9]+ runs" fuzz-run.log | tail -1 | grep -oE "[0-9]+" || true)
          if [ -z "$runs" ]; then
            runs=$(grep -oE "stat::number_of_executed_units: *[0-9]+" fuzz-run.log | tail -1 | grep -oE "[0-9]+$" || true)
          fi
          cov=$(grep -oE "DONE +cov: [0-9]+" fuzz-run.log | tail -1 | grep -oE "[0-9]+$" || true)
          status=ok
          if [ "$rc" -ne 0 ]; then
            status="failed (exit $rc)"
            for kind in "deadly signal" "panicked" "detected memory leaks" "out-of-memory" "libFuzzer: timeout"; do
              if grep -q "$kind" fuzz-run.log; then status="$status: $kind"; break; fi
            done
          elif [ "${runs:-0}" -le 0 ]; then
            status="0 inputs executed"
          fi
          {
            echo "| target | runs | coverage | result |"
            echo "|---|---|---|---|"
            echo "| $T | ${runs:-0} | ${cov:-?} | $status |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ "${runs:-0}" -le 0 ]; then
            echo "::error::fuzz target $T executed 0 inputs"
            exit 1
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/fuzz-run.log
          if-no-files-found: ignore
          retention-days: 14

  # one result for the workflow: run=true needs every fuzz job to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  # not a required status check: pull_request keeps its paths, so a pull request that
  # touches none of them has no run and a required check would stay pending
  gate:
    name: Gate
    if: always()
    needs: [changes, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
