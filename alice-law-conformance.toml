# ALICE-Law conformance manifest for this crate (alice-edge). One entry per gate
# defined in ALICE-Law's conformance/gates.toml. Schema (status / evidence /
# mutant / since / note / reference_repo) is docs/CONFORMANCE.md's "Manifest"
# section in that repository.
#
# Every entry is written from what this repository's files show, checked
# directly. A gate is `pass` only with evidence and a mutant that was carried
# out and turned it red; `fail-known` names the unmet part and where it is;
# `unverified` says why it was not decided. Line numbers are those of the
# commit that introduced this file.
#
# What this crate computes: the fits (q16_linear.rs, simd_fit.rs, robust.rs,
# constant_fit.rs, delta.rs, piecewise.rs, ring_buffer.rs) are integer Q16.16
# arithmetic; float transcendentals appear only through alice-det-math in the
# simulated sensors (src/sensors.rs), the depth-capture simulation
# (src/depth_capture.rs) and the classifier features (src/object_classifier.rs).

[G1]
status = "fail-known"
note = "clippy.toml lists every method the G1 list bans for f32 and f64 (52 entries: the 25 banned names plus powi, for f32 and for f64; sin_cos was the one missing and is added on its own commit; the crate calls no powi and no banned method, found by grep over src/). Two parts of the gate are unmet: (1) the CI clippy jobs (ci.yml 'clippy' job, 'no-std-cross' job, the Linux 'test' step for sensors-hw) build no_std, law, std and the docs.rs feature set, but no job lints the `pyo3` feature (src/python.rs, 297 lines; `cargo clippy --lib --features pyo3 -- -D warnings` was run once by hand and is clean, but nothing runs it on a push); (2) there is no canary test that injects a direct call and confirms the lint catches it (the lint was only confirmed by hand: `x.sin_cos()` in src/delta.rs under `--features std` is refused with 'use of a disallowed method f32::sin_cos', and the same call passes before the sin_cos entry)."
reference_repo = "ALICE-LOL"

[G2]
status = "fail-known"
note = "No ban on f32::max / f32::min / f64::max / f64::min in clippy.toml, no Law helper and no default-deny manifest of raw_* sites. Lint-measured library sites (the four methods added temporarily to clippy.toml, full feature set plus edge-pipeline): src/object_classifier.rs 18 (86, 87, 88, 94, 104, 110 x2, 116, 134, 135, 136, 142, 148 x2, 152, 360, 367, 374 via fold(f32::max)), src/sdf_compress.rs 6 (287-292), src/edge_pipeline.rs 9 (382-387, 390-392), src/ml_bridge.rs 1 (105); tests/analytic_oracle.rs 300 and 304 are test code. The fit code is integer arithmetic and has no float max/min; no SIMD width does a float max/min (src/simd_fit.rs SSE2/NEON kernels are integer), so the per-width tests the gate asks for have no site to cover here."
reference_repo = "ALICE-SDF"

