[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "alice-edge"
# maturin reads the version from Cargo.toml, so the wheel cannot drift from the crate
dynamic = ["version"]
requires-python = ">=3.8"
description = "Embedded Model Generator — Don't send data, send the law"
# the SPDX expression from Cargo.toml (checked by scripts/check_py_license.py);
# LICENSE-Proprietary holds the terms
license = "LicenseRef-Proprietary"
license-files = ["LICENSE-Proprietary"]
authors = [{ name = "Moroya Sakamoto" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["pyo3"]
