name: CI

# Every step is a gate: there is no `continue-on-error` in this file. A step
# that must not block belongs in security-audit.yml (coverage) or fuzz.yml
# (time-boxed exploration), never here.
#
# scripts/preflight.sh runs the same commands with the same arguments locally;
# a step added here is added there in the same commit.

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run on the same branch cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"
  # docs.rs feature set (Cargo.toml [package.metadata.docs.rs]). pyo3 needs a
  # Python runtime and sensors-hw needs Linux GPIO / libudev, both handled in
  # dedicated steps below.
  FULL_FEATURES: "std,zip,law,codec,db,ml,sdf,depth-camera,asp,sensors,mqtt,dashboard,ffi,serde-raw"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # - macos-latest      → aarch64-apple-darwin
        # - ubuntu-24.04-arm  → aarch64-unknown-linux-gnu
        # - ubuntu-latest     → x86_64-unknown-linux-gnu
        # - windows-latest    → x86_64-pc-windows-msvc
        # The core, std and law suites run on every OS. The steps that pull in
        # the optional bridges (rusb / rumqttc / alice-sdf and the other
        # crates.io siblings) run on Linux and macOS only.
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings

      # rust-toolchain.toml pins the exact version; the action installs it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check (no default features, no_std)
        run: cargo check --lib --no-default-features

      - name: Test (no default features, no_std core)
        run: cargo test --lib --no-default-features

      # every integration test target must build without any feature: a file
      # that uses a gated item without its own cfg breaks a plain `cargo test`
      - name: Build all integration tests (no default features)
        run: cargo test --tests --no-run --no-default-features

      - name: Build (std)
        run: cargo build --lib --features "std"

      - name: Test (std)
        run: cargo test --lib --features "std"

      - name: Doc tests (std)
        run: cargo test --doc --features "std"

      # Cross-platform bit-exactness: the golden hashes in
      # tests/determinism_golden.rs are the same constants on all four legs of
      # this matrix, so a platform-dependent float operation fails here. The
      # no-feature run covers the no_std core; the std run adds the modules
      # that need alloc, and the full-feature run below adds law and ml.
      #
      # scripts/run_tests.sh fails the step when no test ran or when
      # determinism_golden ran none (a feature or target mismatch would
      # otherwise pass as an empty run)
      - name: Test — determinism goldens (no default features)
        shell: bash
        run: scripts/run_tests.sh determinism_golden -- cargo test --test determinism_golden --no-default-features

      - name: Test — determinism goldens (std)
        shell: bash
        run: scripts/run_tests.sh determinism_golden -- cargo test --test determinism_golden --features "std"

      # law_id goldens need only `law` (no_std + alloc), so they run on every
      # leg here; the full-feature run below is skipped on Windows.
      - name: Test — determinism goldens (law)
        shell: bash
        run: scripts/run_tests.sh determinism_golden -- cargo test --test determinism_golden --features "law"

      # G4 / G5: the goldens and the signed-zero / cancellation cases in both
      # profiles on every leg (x86_64 and aarch64), so a contraction or
      # reassociation one target's optimiser makes is a changed bit
      - name: Test — goldens and float edges (std, debug)
        shell: bash
        run: scripts/run_tests.sh determinism_golden,float_edge_golden -- cargo test --test determinism_golden --test float_edge_golden --features "std,law"

      - name: Test — goldens and float edges (std, release)
        shell: bash
        run: scripts/run_tests.sh determinism_golden,float_edge_golden -- cargo test --release --test determinism_golden --test float_edge_golden --features "std,law"

      # Degenerate inputs: empty / length-one windows, the guarded divisions,
      # out-of-range and non-finite arguments, the Q16 wrap and the integer
      # overflow paths. The overflow cases branch on `debug_assertions`, so
      # both profiles are run.
      - name: Test — panic contract (std, debug)
        run: cargo test --test panic_contract --features "std"

      - name: Test — panic contract (std, release)
        run: cargo test --release --test panic_contract --features "std"

      # G14: round-to-nearest-even and no flush-to-zero, asserted at run time in
      # both profiles (scripts/run_tests.sh fails when the binary ran no test)
      - name: Test — float environment (debug and release)
        shell: bash
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment --no-default-features
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment --no-default-features

      # alice_zip::law without std: lib + doc tests, the closed-form oracles
      # in tests/edge_law.rs, and the example run end to end
      - name: Test — law (lib)
        run: cargo test --lib --features "law"

      - name: Doc tests — law
        run: cargo test --doc --features "law"

      - name: Test — law oracles (tests/edge_law.rs)
        run: cargo test --test edge_law --features "law"

      - name: Run example edge_law
        run: cargo run --example edge_law --features "law"

      # 解析解 oracle (tests/analytic_oracle.rs): 上の step は --lib なので tests/ が走らない
      # sdf feature の球 primitive oracle は crates.io alice-sdf 1.9 で実行
      - name: Test — analytic oracles (std + sdf)
        if: runner.os != 'Windows'
        run: cargo test --test analytic_oracle --features "std,sdf"

      # fit_linear_robust against the rule in its documentation
      # (tests/support/robust_reference.rs, shared with the fuzz target)
      - name: Test — robust fit contract (std)
        run: cargo test --test robust_contract --features "std"

      # CoefficientStore returns ALICE-DB's errors (tests/db_bridge_errors.rs):
      # a store of another arithmetic is a Mismatch, not an empty result
      - name: Test — db bridge errors (db)
        run: cargo test --test db_bridge_errors --features "db"

      # One build + one test run with every optional bridge on: the crates.io
      # siblings (alice-zip / codec / db / sdf / ml / analytics / libasp) are
      # real dependencies here, not stubs.
      - name: Build (full feature set)
        if: runner.os != 'Windows'
        run: cargo build --lib --features "$FULL_FEATURES"

      - name: Test (full feature set)
        if: runner.os != 'Windows'
        run: cargo test --lib --features "$FULL_FEATURES"

      - name: Test (edge-pipeline)
        if: runner.os != 'Windows'
        run: cargo test --lib --features "edge-pipeline"

      # law and ml add their own golden scenarios and panic cases
      - name: Test — determinism goldens (full feature set)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/run_tests.sh determinism_golden -- cargo test --test determinism_golden --features "$FULL_FEATURES"

      - name: Test — determinism goldens (full feature set, release)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/run_tests.sh determinism_golden -- cargo test --release --test determinism_golden --features "$FULL_FEATURES"

      - name: Test — panic contract (full feature set, debug)
        if: runner.os != 'Windows'
        run: cargo test --test panic_contract --features "$FULL_FEATURES"

      - name: Test — panic contract (full feature set, release)
        if: runner.os != 'Windows'
        run: cargo test --release --test panic_contract --features "$FULL_FEATURES"

      - name: Build examples (sensors + dashboard + mqtt)
        if: runner.os != 'Windows'
        run: cargo build --examples --features "std,sensors,dashboard,mqtt"

      # Real GPIO / I2C / SPI / UART drivers only compile on Linux
      # (rppal + serialport, which needs libudev).
      - name: Install libudev (sensors-hw)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Clippy (std + sensors-hw, Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --lib --features "std,sensors-hw" -- -D warnings

  no-std-cross:
    name: no_std cross-compile (thumbv7em)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build no_std (thumbv7em-none-eabihf)
        run: cargo build --lib --target thumbv7em-none-eabihf --no-default-features

      - name: Build no_std + ffi (thumbv7em-none-eabihf)
        run: cargo build --lib --target thumbv7em-none-eabihf --no-default-features --features "ffi"

      # law needs alloc but not std: alice-zip is built without its std feature
      - name: Build no_std + law + ffi (thumbv7em-none-eabihf)
        run: cargo build --lib --target thumbv7em-none-eabihf --no-default-features --features "law,ffi"

      - name: Clippy no_std + law + ffi (thumbv7em-none-eabihf)
        run: cargo clippy --lib --target thumbv7em-none-eabihf --no-default-features --features "law,ffi" -- -D warnings

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # the release tags: scripts/id_move_check.py compares with the newest one
          fetch-depth: 0
      - uses: ./.github/actions/alice-siblings

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (no_std, lib)
        run: cargo clippy --lib --no-default-features -- -D warnings

      - name: Clippy (no_std + law, lib + law oracles + examples)
        run: cargo clippy --lib --test edge_law --examples --no-default-features --features "law" -- -D warnings

      - name: Clippy (std, lib + all targets)
        run: cargo clippy --lib --all-targets --features "std" -- -D warnings

      - name: Clippy (full feature set, lib + all targets)
        run: cargo clippy --lib --all-targets --features "$FULL_FEATURES" -- -D warnings

      # edge-pipeline gates code of its own (FULL_FEATURES enables its parts but
      # not the feature itself), and pyo3 gates the Python bindings: lint both so
      # no source file escapes the disallowed-methods list (G1 / G10)
      - name: Clippy (full feature set + edge-pipeline, lib + all targets)
        run: cargo clippy --lib --all-targets --features "$FULL_FEATURES,edge-pipeline" -- -D warnings

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Clippy (pyo3 bindings, lib)
        run: cargo clippy --lib --features "pyo3" -- -D warnings

      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      # the preflight mirror of law-readme-block.yml (the check itself runs there, here its tests)
      - name: README ALICE-Law block preflight check (tests)
        run: python3 scripts/test_law_readme_block_check.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py
      # G7 / G8: the boundary of the public API, enumerated from rustdoc JSON
      # (pinned toolchain, RUSTC_BOOTSTRAP=1, pyo3 included: python is set up
      # above), against scripts/api_boundary.toml; the C ABI and Python entry
      # points by text against scripts/boundaries.toml
      - name: API boundary (tests)
        run: python3 scripts/test_api_boundary.py
      - name: API boundary (rustdoc JSON, every item decided)
        run: python3 scripts/api_boundary.py
      - name: Boundary guard (tests)
        run: python3 scripts/test_boundary_guard.py
      - name: Boundary guard (C ABI and Python entry points decided)
        run: python3 scripts/boundary_guard.py
      # G9: an identifier (EDGE_SEMANTICS_ID) moves only with a breaking version, with the
      # released value in its previous list (when it has one) and both values named in
      # CHANGELOG.md; the released value is read from the published crate at the newest
      # release tag (scripts/id_move_check.py, shared with the other ALICE crates). A
      # registry that cannot be read fails on main and warns on ci/ branches and PRs
      - name: Identifier moves (tests)
        run: python3 scripts/test_id_move_check.py
      - name: Identifier moves (the release compared with)
        id: id-base
        run: echo "crate=$(python3 scripts/id_move_check.py --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/cache/*/${{ steps.id-base.outputs.crate }}.crate
          key: id-move-${{ steps.id-base.outputs.crate }}
      - name: Identifier moves (against the published release)
        run: python3 scripts/id_move_check.py

  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings

      # Must match `rust-version` in Cargo.toml; bump both in the same commit.
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.120

      - uses: Swatinem/rust-cache@v2

      - name: cargo check on MSRV (lib, no_std)
        run: cargo +1.87 check --lib --no-default-features

      - name: cargo check on MSRV (lib, no_std + law)
        run: cargo +1.87 check --lib --no-default-features --features "law"

      - name: cargo check on MSRV (lib, full feature set)
        run: cargo +1.87 check --lib --features "$FULL_FEATURES"

  feature-powerset:
    name: Feature powerset (cargo-hack, depth 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # Every feature alone and every pair. Excluded:
      # pyo3 (Python runtime), sensors-hw (Linux libudev, checked in `test`),
      # edge-pipeline (a pure alias of depth-camera+sdf+ml+asp, tested in `test`).
      - name: cargo hack check --feature-powerset
        run: >-
          cargo hack check --lib --feature-powerset --depth 2
          --exclude-features pyo3,sensors-hw,edge-pipeline
          --no-dev-deps

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo doc (lib, no-deps, std)
        run: cargo doc --lib --no-deps --features "std"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

      - name: cargo doc (lib, no-deps, docs.rs feature set)
        run: cargo doc --lib --no-deps --features "$FULL_FEATURES"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  docs-lint:
    # run on every OS so a locale or path difference in the checker itself
    # shows up here rather than as a silent pass
    name: Docs lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check
      # the ../ALICE-* path dependencies (until alice-zip 0.11, alice-db 0.6 and alice-sdf 7 are
      # on crates.io): the clones are the commits in .github/alice-siblings (the action above),
      # and preflight runs the same check locally
      - name: ALICE sibling check (tests)
        run: python scripts/test_alice_siblings_check.py
      - name: ALICE sibling check (the clones are .github/alice-siblings)
        run: python scripts/alice_siblings_check.py
      # the status codes of the C ABI are defined in src/ffi.rs,
      # bindings/alice_edge.h and bindings/AliceEdge.cs; the three must agree
      # (exactly 4 codes per file, 0 compared is red)
      - name: FFI status codes (tests)
        run: python scripts/test_ffi_status_check.py
      - name: FFI status codes (Rust / C / C# agree)
        run: python scripts/ffi_status_check.py
      # the published .crate is an allowlist (Cargo.toml `include`): no CI,
      # scripts or fuzz files in it, every Cargo target and every embedded
      # file present (an empty list or 0 targets compared is red)
      - name: Package contents (tests)
        run: python scripts/test_package_contents_check.py
      - name: Package contents (cargo package --list)
        run: python scripts/package_contents_check.py
      # no part of src/**/*.rs may read OS entropy or the wall clock in a way
      # that affects a stored/computed/transmitted value (G10); clippy's
      # disallowed-methods is the first, compiled layer, this is the second
      # the zero-test guard shared with ALICE-DB / ALICE-Analytics, on each
      # OS's own bash
      - name: run_tests.sh (tests)
        run: python scripts/test_run_tests.py
      - name: Entropy guard (tests)
        run: python scripts/test_entropy_guard.py
      - name: Entropy guard (no OS entropy / wall clock in production code)
        run: python scripts/entropy_guard.py
      # G13: no unspecified-order collection, thread combination or address order in production code
      - name: Order guard (tests)
        run: python scripts/test_order_guard.py
      - name: Order guard
        run: python scripts/order_guard.py
      # G1, libm half: a direct libm dependency must come with the libm:: ban
      # in clippy.toml and scripts/libm_ban_check.py (0 manifests read fails)
      - name: libm dependency guard (test, then check)
        run: |
          python scripts/test_libm_dependency_guard.py
          python scripts/libm_dependency_guard.py
      # RUSTSEC-2026-0235 is ignored in security-audit.yml / deny.toml because
      # rkyv is reached only through a dependency; no manifest here may declare
      # rkyv and no .rs file may use it (0 manifests or 0 .rs files is red)
      - name: No direct rkyv (tests)
        run: python scripts/test_no_direct_rkyv.py
      - name: No direct rkyv (manifests and Rust sources)
        run: python scripts/no_direct_rkyv.py
      # G14, static half: no fast-math-style flag, target-cpu=native or flag value
      # the guard cannot resolve in any file a flag can come from (deliberate
      # occurrences in scripts/build_config_allowlist.toml); nothing read fails
      - name: Build configuration guard (test, then check)
        run: |
          python scripts/test_build_config_guard.py
          python scripts/build_config_guard.py
      # the dynamic half's parser on each OS (the check itself is the build-flags job)
      - name: Effective rustc flags check (tests)
        run: python scripts/test_build_flags_check.py

  build-flags:
    # G14, dynamic half: the flags cargo really passes to rustc, read from `-v` in a
    # fresh target directory (a reused one prints Fresh without the command line),
    # for the no_std, std and full feature sets in the release profile; fails on a
    # native / fast-math / x87 flag, and when no command line for this crate was seen
    name: Effective rustc flags (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Effective rustc flags (no_std, std, full feature set)
        shell: bash
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib --no-default-features
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features std
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features "$FULL_FEATURES"

  python:
    # the `pyo3` feature (Python bindings) is built only here: maturin builds the
    # wheel with the features in pyproject.toml [tool.maturin], the wheel's
    # license metadata must equal the crate's, and the binding tests must collect
    # at least one test (0 collected is red)
    name: Python (maturin build + binding tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install maturin and test dependencies
        run: python -m pip install --upgrade pip 'maturin>=1.5,<2.0' numpy pytest

      - name: Build the wheel (maturin)
        run: maturin build --out dist

      - name: Install the built wheel
        run: pip install dist/*.whl

      - name: Wheel license metadata equals the crate license
        run: |
          python scripts/test_check_py_license.py
          python scripts/check_py_license.py
          python - <<'PY'
          import glob, sys, tomllib, zipfile
          want = tomllib.load(open("Cargo.toml", "rb"))["package"]["license"]
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as z:
              meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              lines = z.read(meta).decode("utf-8").splitlines()
          got = [l.split(":", 1)[1].strip() for l in lines if l.startswith("License-Expression:")]
          if got != [want]:
              sys.exit(f"wheel License-Expression {got} != Cargo.toml license {want!r}")
          print(f"wheel License-Expression: {want}")
          PY

      - name: Import smoke
        run: python -c "import alice_edge; print('alice_edge imported, Q16_ONE =', alice_edge.Q16_ONE)"

      - name: Python binding tests, fail on 0 tests
        run: |
          collected=$(python -m pytest python/tests --collect-only -q 2>/dev/null | grep -c '::')
          echo "collected ${collected} python test(s)"
          [ "${collected}" -gt 0 ] || { echo "no python tests collected"; exit 1; }
          python -m pytest python/tests -v

      - name: Python example runs
        run: python examples/python_batch.py

  actionlint:
    name: actionlint (workflow YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alice-siblings
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
      # every job has a job-level timeout-minutes (a hung step otherwise holds a shared
      # runner for GitHub's 6-hour limit); the checker's own tests run first
      - name: workflow-timeouts
        run: |
          python3 scripts/test_workflow_timeouts.py
          python3 scripts/workflow_timeouts.py
      # no built library or executable is tracked (an exception is a path listed in
      # .github/tracked-binaries.txt with a reason); the checker's own tests run first
      - name: tracked-binaries tests
        run: python3 scripts/test_tracked_binaries.py
      - name: tracked-binaries
        run: python3 scripts/tracked_binaries.py
