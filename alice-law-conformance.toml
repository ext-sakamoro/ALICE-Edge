# ALICE-Law conformance manifest for this crate (alice-edge). One entry per gate
# defined in ALICE-Law's conformance/gates.toml. Schema (status / evidence /
# mutant / since / note / reference_repo) is docs/CONFORMANCE.md's "Manifest"
# section in that repository.
#
# Every entry is written from what this repository's files show, checked
# directly. A gate is `pass` only with evidence and a mutant that was carried
# out and turned it red; `fail-known` names the unmet part and where it is;
# `unverified` says why it was not decided. Line numbers are those of the
# commit that introduced this file.
#
# What this crate computes: the fits (q16_linear.rs, simd_fit.rs, robust.rs,
# constant_fit.rs, delta.rs, piecewise.rs, ring_buffer.rs) are integer Q16.16
# arithmetic; float transcendentals appear only through alice-det-math in the
# simulated sensors (src/sensors.rs), the depth-capture simulation
# (src/depth_capture.rs) and the classifier features (src/object_classifier.rs).

