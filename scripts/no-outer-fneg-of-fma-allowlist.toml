# tools/no-outer-fneg-of-fma (syntax-tree pre-check) and scripts/fneg_fma_ir_check.py
# (optimised-IR gate), ALICE-Law G3. Both read this file.
#
# expected-fma-calls / expected-src-fma-calls: the fma-family calls the syntax-tree
# check finds in every scanned file / in the library code of src/ (items under #[test] or
# a cfg that holds only under test are not library code). Both must equal what it finds:
# update them in the commit that adds or removes a call (a repository without any declares 0).
expected-fma-calls = 2
expected-src-fma-calls = 2

# [[ir]]: per target and package, the floor of fma-family calls in the optimised IR
# (scripts/fneg_fma_ir_check.py --write-floor, run on the CI host class). Fewer fails,
# and so does 0 while expected-src-fma-calls is not 0.
# The floors are the crate's own two calls (src/sensors.rs, the NMEA degree / minute split):
# the build pulls aws-lc-sys (C), so the Linux IR cannot be cross-built on another host, and
# 2 is a lower bound on every target (aarch64-apple-darwin measures exactly 2)

# [[allow]]: a finding by path, exact trimmed line text and count, with a reason.
# Only tests/ and examples/ can carry one; src/ has no exception.

[[ir]]
target = "x86_64-unknown-linux-gnu"
package = "alice-edge"
min-fma-calls = 2

[[ir]]
target = "aarch64-unknown-linux-gnu"
package = "alice-edge"
min-fma-calls = 2
