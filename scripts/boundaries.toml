# scripts/boundary_guard.py (ALICE-Law G7), text layer: the C ABI and Python
# entry points (Python functions are not in rustdoc's public API), with the
# decision for each.
[boundary]
"ffi::alice_delta_decode" = "local: exact integer inverse of alice_delta_encode on the caller's own buffer: no rounding rule and no value from another producer"
"ffi::alice_delta_encode" = "local: exact integer delta transform of the caller's own buffer"
"ffi::alice_edge_clear_last_error" = "local: error-message plumbing, no Law-bearing value"
"ffi::alice_edge_free_error_string" = "local: error-message plumbing, no Law-bearing value"
"ffi::alice_edge_last_error" = "local: error-message plumbing, no Law-bearing value"
"ffi::alice_edge_semantics_id" = "local: reports this build's identifier"
"ffi::alice_edge_version" = "local: reports a constant of this build"
"ffi::alice_evaluate_cubic" = "handshake: coefficients_with_another_identifier_are_refused"
"ffi::alice_evaluate_linear" = "handshake: coefficients_with_another_identifier_are_refused"
"ffi::alice_evaluate_quadratic" = "handshake: coefficients_with_another_identifier_are_refused"
"ffi::alice_filter_outliers_mad" = "local: fits the caller's raw samples in this build; no coefficients come in"
"ffi::alice_fit_constant" = "local: fits the caller's raw samples in this build and returns a mean; no value from another producer comes in"
"ffi::alice_fit_cubic" = "handshake: coefficients_with_another_identifier_are_refused"
"ffi::alice_fit_linear" = "handshake: coefficients_with_another_identifier_are_refused"
"ffi::alice_fit_linear_robust" = "local: fits the caller's raw samples; its AliceLinearResult carries this build's semantics_id"
"ffi::alice_fit_linear_simd" = "local: fits the caller's raw samples; its AliceLinearResult carries this build's semantics_id"
"ffi::alice_fit_quadratic" = "handshake: coefficients_with_another_identifier_are_refused"
"ffi::alice_int_to_q16" = "local: exact integer scaling of a host value"
"ffi::alice_q16_to_f32" = "local: a local conversion of a host value, computed by this build"
"ffi::alice_q16_to_int" = "local: exact integer scaling of a host value"
"ffi::alice_residual_error" = "handshake: coefficients_with_another_identifier_are_refused"
"ffi::alice_should_use_linear" = "local: model selection over the caller's raw samples in this build"
"ffi::alice_zeroize" = "local: overwrites the caller's buffer with zeros"
"python::compute_error" = "handshake: id_check_refuses_another_identifier"
"python::evaluate_linear" = "handshake: id_check_refuses_another_identifier"
"python::evaluate_linear_batch" = "handshake: id_check_refuses_another_identifier"
"python::fit_constant" = "local: fits the caller's raw samples in this build; no value from another producer comes in"
"python::fit_linear" = "local: fits the caller's raw samples in this build; semantics_id() gives the identifier to pass back with the coefficients"
"python::fit_linear_batch" = "local: fits the caller's raw samples in this build; semantics_id() gives the identifier to pass back"
"python::int_to_q16" = "local: exact integer scaling of a Python value"
"python::q16_to_f32" = "local: a local conversion of a Python value, computed by this build"
"python::q16_to_f32_batch" = "local: a local conversion of Python values, computed by this build"
"python::q16_to_int" = "local: exact integer scaling of a Python value"
"python::semantics_id" = "local: reports this build's identifier"
"python::should_use_linear" = "local: model selection over the caller's raw samples in this build"
